# ============================================================================
# nginx 配置 - Vue3 SPA + /api 反代 + Cesium 长缓存
# ----------------------------------------------------------------------------
# /api/v1/* -> proxy_pass http://backend:8000 (docker-compose 服务名)
# /         -> try_files $uri $uri/ /index.html (Vue Router history mode 兜底)
# /cesium/* -> 长缓存 (viteStaticCopy 把 Workers/Assets/Widgets/ThirdParty
#              copy 到 dist/cesium/, 几十 MB, 缓存省带宽)
# ============================================================================

server {
    listen 80;
    server_name _;

    root /usr/share/nginx/html;
    index index.html;

    # 上传文件大小上限 (CSV/XLSX/PDF, 给 50MB 余量)
    client_max_body_size 50M;

    # Vue Router history mode: 所有未匹配路由兜底到 index.html
    location / {
        try_files $uri $uri/ /index.html;
    }

    # API 反代到 backend 容器
    # /api/v1/health -> http://backend:8000/api/v1/health
    location /api/v1/ {
        proxy_pass http://backend:8000;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;

        # SSE 支持 (AI 抽屉流式响应 / assistant/sessions/*/messages/stream)
        proxy_buffering off;
        proxy_cache off;
        proxy_read_timeout 300s;

        # 上传文件 (照片重建 / PDF 知识库导入) 可能慢
        proxy_send_timeout 120s;
    }

    # Cesium 静态资源长缓存 (Workers/Assets/Widgets/ThirdParty 几十 MB)
    # viteStaticCopy 把 cesium 包 copy 到 dist/cesium/, 文件名带 hash 可永久缓存
    location /cesium/ {
        expires 10y;
        add_header Cache-Control "public, immutable";
        access_log off;
    }

    # 静态资源 hash 文件名 (vite build 默认行为) 永久缓存
    location ~* \.(js|css|woff2?|ttf|eot|svg|png|jpg|jpeg|gif|webp|ico)$ {
        expires 1y;
        add_header Cache-Control "public, immutable";
        access_log off;
    }

    # gzip 压缩 (nginx:alpine 默认装了 ngx_http_gzip_module)
    gzip on;
    gzip_min_length 1024;
    gzip_comp_level 6;
    gzip_types text/plain text/css application/json application/javascript text/xml application/xml application/xml+rss text/javascript;
    gzip_vary on;
}
