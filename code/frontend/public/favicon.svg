<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 32 32">
  <!-- 暖白背景圆角方块 -->
  <rect width="32" height="32" rx="6" fill="#F5F2EB"/>
  <!-- 建筑轮廓 (3 个高度递减的矩形, 模拟建筑群) -->
  <rect x="6"  y="14" width="6" height="12" fill="#5A6B7C"/>
  <rect x="13" y="9"  width="6" height="17" fill="#4A4A4A"/>
  <rect x="20" y="12" width="6" height="14" fill="#5A6B7C"/>
  <!-- 顶部琥珀点 (能耗/状态指示) -->
  <circle cx="16" cy="7" r="1.8" fill="#D49B3B"/>
  <!-- 窗户网格 (左楼) -->
  <rect x="7.5" y="17" width="1" height="1" fill="#F5F2EB" opacity="0.6"/>
  <rect x="9.5" y="17" width="1" height="1" fill="#F5F2EB" opacity="0.6"/>
  <rect x="7.5" y="20" width="1" height="1" fill="#F5F2EB" opacity="0.6"/>
  <rect x="9.5" y="20" width="1" height="1" fill="#F5F2EB" opacity="0.6"/>
  <!-- 中楼窗户 -->
  <rect x="14.5" y="12" width="1" height="1" fill="#F5F2EB" opacity="0.7"/>
  <rect x="16.5" y="12" width="1" height="1" fill="#F5F2EB" opacity="0.7"/>
  <rect x="14.5" y="15" width="1" height="1" fill="#F5F2EB" opacity="0.7"/>
  <rect x="16.5" y="15" width="1" height="1" fill="#F5F2EB" opacity="0.7"/>
  <rect x="14.5" y="18" width="1" height="1" fill="#F5F2EB" opacity="0.7"/>
  <rect x="16.5" y="18" width="1" height="1" fill="#F5F2EB" opacity="0.7"/>
</svg>
