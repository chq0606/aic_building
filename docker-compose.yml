# ============================================================================
# docker-compose.yml - AIC Building 一键启动编排
# ----------------------------------------------------------------------------
# 5 个服务:
#   postgres           - PostgreSQL 15 + pgvector (主数据库)
#   backend            - FastAPI 主服务 (CPU, Prophet/LSTM 跑得动)
#   prediction_worker  - 能耗预测 worker (复用 backend CPU 镜像)
#   triposplat_worker  - 单图重建 worker (GPU, 走 Dockerfile.triposplat)
#   frontend           - Vue3 nginx 静态托管 + /api 反代
#
# 启动顺序: postgres (healthy) -> backend (started) -> {worker, frontend}
# 数据库初始化: ./init.sql 挂到 /docker-entrypoint-initdb.d/, 首次启动自动跑
#
# GPU 服务用 profiles: [gpu] 隔离, 没 NVIDIA 驱动的机器不启 triposplat_worker
#   主动启用: docker compose --profile gpu up
# ============================================================================

services:
  # ─── 数据库 ─────────────────────────────────────────────────────────────
  postgres:
    image: pgvector/pgvector:pg15
    container_name: aic_postgres
    restart: unless-stopped
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-postgres}
      POSTGRES_DB: aic_building
      # 不设 LC_COLLATE/LC_CTYPE: pgvector:pg15 镜像没有 zh_CN.UTF-8 locale,
      # 设了会 initdb 报 invalid locale settings。默认 C locale 即可, 中文按 UTF-8 字节序排序
    volumes:
      # init.sql 首次启动自动跑 (建扩展 + 5 schema + 19 个增量 SQL 合并)
      - ./sql/init.sql:/docker-entrypoint-initdb.d/init.sql:ro
      # 数据持久化到本机 (Windows 用 WSL2 性能好, NTFS 直挂慢)
      - ./data/postgres:/var/lib/postgresql/data
    ports:
      - "5432:5432"  # dev 调试时本机可连
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres -d aic_building"]
      interval: 5s
      timeout: 5s
      retries: 10
      start_period: 30s
    networks:
      - aic_net

  # ─── FastAPI 主服务 ──────────────────────────────────────────────────────
  backend:
    build:
      context: .
      dockerfile: code/backend/Dockerfile
    container_name: aic_backend
    restart: unless-stopped
    environment:
      DATABASE_URL: postgresql://postgres:${POSTGRES_PASSWORD:-postgres}@postgres:5432/aic_building
      JWT_SECRET: ${JWT_SECRET:-dev_only_change_me_in_production}
      GLM_API_KEY: ${GLM_API_KEY:-}
      GLM_MODEL: ${GLM_MODEL:-glm-4.5}
      BGE_MODEL_PATH: ${BGE_MODEL_PATH:-}
      ENV: ${ENV:-prod}
      CORS_ORIGINS: ${CORS_ORIGINS:-http://localhost:8080,http://127.0.0.1:8080}
      APP_REPO_URL: ${APP_REPO_URL:-}
      # EXTRACTED_DATA_DIR 给 seed_bdg2.py 用 (容器内挂载点)
      EXTRACTED_DATA_DIR: /app/extracted_data
    volumes:
      # 上传文件 / 模型权重 / 重建产物 持久化到本机
      - ./code/backend/storage:/app/storage
      - ./code/backend/data:/app/data
      - ./code/backend/logs:/app/logs
      # BDG2 demo 数据 (seed_bdg2.py 用)
      - ./extracted_data:/app/extracted_data:ro
      # seed 脚本 (make seed-demo 用, 单独挂载避免 COPY 进镜像)
      - ./code/seed_bdg2.py:/app/seed_bdg2.py:ro
    ports:
      - "8000:8000"
    depends_on:
      postgres:
        condition: service_healthy
    networks:
      - aic_net

  # ─── 能耗预测 worker (CPU, 复用 backend 镜像) ─────────────────────────────
  prediction_worker:
    build:
      context: .
      dockerfile: code/backend/Dockerfile
    container_name: aic_prediction_worker
    restart: unless-stopped
    # override backend 的 CMD, 跑 prediction worker
    command: ["python", "-m", "worker.prediction_worker"]
    environment:
      DATABASE_URL: postgresql://postgres:${POSTGRES_PASSWORD:-postgres}@postgres:5432/aic_building
      ENV: ${ENV:-prod}
    volumes:
      - ./code/backend/storage:/app/storage
      - ./code/backend/logs:/app/logs
    depends_on:
      backend:
        condition: service_started
      postgres:
        condition: service_healthy
    networks:
      - aic_net

  # ─── TripoSplat 重建 worker (GPU, 单独镜像) ──────────────────────────────
  # 用 profiles: [gpu] 隔离, 没 NVIDIA 驱动的机器不启这个服务
  # 启用: docker compose --profile gpu up
  triposplat_worker:
    profiles: ["gpu"]
    build:
      context: .
      dockerfile: code/backend/Dockerfile.triposplat
    container_name: aic_triposplat_worker
    restart: unless-stopped
    command: ["python", "-m", "worker.triposplat_worker"]
    environment:
      DATABASE_URL: postgresql://postgres:${POSTGRES_PASSWORD:-postgres}@postgres:5432/aic_building
      ENV: ${ENV:-prod}
      # TripoSplat 5 个权重文件目录 (本机 download-ckpts 后挂载)
      TRIPOSPLAT_CKPTS_DIR: /app/storage/triposplat/ckpts
    volumes:
      - ./code/backend/storage:/app/storage
      - ./code/backend/logs:/app/logs
    deploy:
      resources:
        reservations:
          devices:
            - driver: nvidia
              count: all
              capabilities: [gpu]
    depends_on:
      backend:
        condition: service_started
      postgres:
        condition: service_healthy
    networks:
      - aic_net

  # ─── 前端 nginx 静态托管 ───────────────────────────────────────────────
  frontend:
    build:
      context: .
      dockerfile: code/frontend/Dockerfile
    container_name: aic_frontend
    restart: unless-stopped
    ports:
      - "8080:80"
    depends_on:
      backend:
        condition: service_started
    networks:
      - aic_net

networks:
  aic_net:
    driver: bridge
